name: Product defect
description: Report reproducible behaviour that differs from an approved requirement
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, participant data, safeguarding details, or exploitable security information. Use the private incident/security channel for sensitive reports.
  - type: textarea
    id: outcome
    attributes:
      label: User impact
      description: Who is affected and what outcome is prevented or made unsafe?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Numbered steps using non-sensitive test data, including build and scenario-pack version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behaviour
      description: Link the relevant requirement, contract, design, or decision when possible.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact level
      options:
        - Critical — safety, privacy, security, data loss, or unusable core loop
        - High — core outcome blocked with no reasonable workaround
        - Medium — degraded outcome with a workaround
        - Low — minor or cosmetic issue
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Safe disclosure
      options:
        - label: I removed secrets and personal/participant data from this report.
          required: true
