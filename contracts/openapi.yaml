openapi: 3.1.0
info:
  title: Evidence Gym API
  version: 0.1.0
  description: MVP learner API. Prose semantics live in docs/03-contracts/API_CONTRACT.md.
servers:
  - url: https://api.example.invalid/v1
security:
  - firebaseBearer: []
paths:
  /catalog/path:
    get:
      operationId: getLearningPath
      security: []
      responses:
        '200':
          description: Published path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPath' }
  /missions/{missionId}:
    get:
      operationId: getMission
      security: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Exact published mission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '404': { $ref: '#/components/responses/Problem' }
  /attempts:
    post:
      operationId: startAttempt
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [missionId, missionVersion]
              properties:
                missionId: { type: string }
                missionVersion: { type: string }
      responses:
        '201':
          description: Attempt started or idempotently returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '409': { $ref: '#/components/responses/Problem' }
  /attempts/{attemptId}/prediction:
    post:
      operationId: submitPrediction
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PredictionInput' }
      responses:
        '200':
          description: Updated attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /attempts/{attemptId}/evidence-actions:
    post:
      operationId: useEvidenceAction
      description: |
        Runs one curated evidence action and returns normalized evidence
        or a safe degraded result.

        **A curated action may advance an attempt once.** Replaying with
        the same `Idempotency-Key` returns the original result;
        repeating the same `actionId` with a new key returns
        `evidence-action-already-used`. A rejected repeat advances
        nothing — not `Attempt.version`, not hint progression, not
        minimum completion evidence, not skill practice, not process XP.

        Without this, one action could be replayed to inflate every
        number the product scores by. It also matches the
        `UNIQUE (attempt_id, action_ref)` constraint the persistence
        layer already enforces (#25).

        **Distinguish the `409` by `code`, never by the status alone.**
        Three unrelated situations share it here and they call for
        opposite responses from a client:

        * `stale-attempt-version` — this client's `version` is behind
          the server's; the attempt moved on elsewhere.
        * `idempotency-key-conflict` — the same key was replayed with a
          different body inside the retention window.
        * `evidence-action-already-used` — as above; nothing was lost,
          the learner already has this result.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actionId, version]
              properties:
                actionId: { type: string }
                input: { type: object, additionalProperties: true, maxProperties: 10 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Normalized evidence or safe degraded result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /attempts/{attemptId}/hints:
    post:
      operationId: requestHint
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Structured Socratic hint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hint' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /attempts/{attemptId}/conclusion:
    post:
      operationId: completeAttempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConclusionInput' }
      responses:
        '200':
          description: Atomic completion result
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, xpAwarded, progress]
                properties:
                  receiptId: { type: string }
                  xpAwarded: { type: integer, minimum: 0 }
                  progress: { $ref: '#/components/schemas/Progress' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /receipts/{receiptId}:
    get:
      operationId: getReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Evidence Receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/progress:
    get:
      operationId: getMyProgress
      responses:
        '200':
          description: Learner progress projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
  /reports:
    post:
      operationId: reportContent
      summary: Report a problem with published content
      description: |
        Accepts a learner's report and confirms nothing beyond acceptance.

        **What `202` means, and what it does not.** It means the service
        has taken responsibility for the report. It is not a statement
        that anyone has read it, will read it, or will act on it, and no
        response on this endpoint may imply otherwise. Moderation state,
        reviewer identity and queue position stay out of the contract
        entirely — exposing them would turn a safety feature into a
        surface for probing who is looking at what.

        A `202` must not be returned until the report is durably stored
        or queued. Accepting and discarding would make this endpoint a
        confirmation with nothing behind it, which is worse than not
        offering the report button at all: a learner who reports harmful
        content and is thanked for it reasonably stops looking for
        another way to raise it.

        **Learner-facing wording is bound by the same rule** (Role 1,
        #33). The client says the report was received and names what it
        was attached to. It does not promise a human will read it, and
        it does not promise a timeline, because neither is backed by
        anything today. A product whose subject is checking claims
        before believing them cannot make an unbacked claim on its own
        confirmation screen.

        On failure the client keeps the dialog open with the learner's
        text intact and does not confirm receipt; offline is reported as
        offline rather than as "try again", which is bad advice when the
        thing to do is wait.

        In demo mode nothing leaves the device and the client says so
        explicitly, rather than reusing the live confirmation.

        **Failure codes.** `409 idempotency-key-conflict` when the same
        key is reused with different content; a replay with the same key
        and the same body returns the original acceptance rather than
        creating a second report. `503` when the report could not be
        durably stored or queued — returned in preference to a `202` the
        service cannot stand behind, because a learner told their report
        landed will not send it again.

        **Privacy.** The reporter is the verified principal; a client
        cannot report on behalf of another learner. Bearer tokens,
        request headers and device identifiers are not stored, and
        report detail does not appear in logs (`PRIVACY.md`). `detail`
        is free text a learner may fill with anything, so it is treated
        as sensitive by default.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [missionId, reason]
              properties:
                missionId: { type: string }
                reason:
                  enum: [incorrect, harmful, outdated, copyright, accessibility, other]
                detail: { type: string, maxLength: 1000 }
      responses:
        '202':
          description: |
            Accepted and durably recorded. Exposes no moderation state,
            reviewer identity or queue position, and asserts nothing
            about review.
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    LearningPath:
      type: object
      required: [version, locale, nodes]
      properties:
        version: { type: string }
        locale: { type: string }
        nodes:
          type: array
          items:
            type: object
            required: [missionId, title, state]
            properties:
              missionId: { type: string }
              title: { type: string }
              state: { enum: [locked, available, completed] }
    Mission:
      type: object
      additionalProperties: false
      required: [id, version, title, claim, media, accessibility, reactions, evidenceActions, skillTags, minimumCompletionEvidence, contentWarnings]
      properties:
        id: { type: string }
        version: { type: string }
        title: { type: string }
        claim: { type: string }
        media:
          type: object
          required: [type, altText]
          properties:
            type: { enum: [image, video, audio, text] }
            url: { type: string, format: uri }
            altText: { type: string }
            transcript: { type: string }
        accessibility: { $ref: '#/components/schemas/Accessibility' }
        reactions:
          type: array
          items: { enum: [trust, suspicious, investigate] }
        evidenceActions:
          type: array
          items:
            type: object
            required: [id, type, label]
            properties:
              id: { type: string }
              type: { type: string }
              label: { type: string }
        skillTags: { type: array, items: { type: string } }
        # Role 3 owns this taxonomy and assigns the tags; Role 2 projects
        # the reviewed values from the pinned mission fixture without
        # interpreting or rewriting them; Role 1 filters the younger
        # audience mode on them, failing closed on any tag it does not
        # recognise.
        #
        # Required rather than optional, and an empty array is a positive
        # statement that the mission was reviewed and declares nothing to
        # warn about. That distinction is the point: an absent field and
        # an empty list are indistinguishable to a client, so an optional
        # field would let a server that simply does not send it look
        # exactly like content certified as unremarkable — and the
        # younger mode would be filtering on silence.
        #
        # Audience mode remains a suitability preference. It is not age
        # assurance and not an access-control boundary (#26, PRIVACY.md).
        contentWarnings:
          type: array
          uniqueItems: true
          items: { type: string }
        testsCriticalIgnoring: { type: boolean, default: false }
        minimumCompletionEvidence:
          type: integer
          minimum: 0
          maximum: 6
    Accessibility:
      type: object
      additionalProperties: false
      required: [plainLanguageSummary, mediaAlternatives, interactionNotes]
      properties:
        plainLanguageSummary: { type: string, minLength: 1 }
        mediaAlternatives:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        interactionNotes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    Attempt:
      type: object
      required: [id, missionId, missionVersion, state, version]
      properties:
        id: { type: string }
        missionId: { type: string }
        missionVersion: { type: string }
        state: { enum: [ready, predicted, investigating, concluded, reflected, completed] }
        version: { type: integer, minimum: 1 }
    PredictionInput:
      type: object
      additionalProperties: false
      required: [reaction, confidence, version]
      properties:
        reaction: { enum: [trust, suspicious, investigate] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        version: { type: integer, minimum: 1 }
    EvidenceResult:
      type: object
      required: [actionId, status, items, limitations, attemptVersion]
      properties:
        actionId: { type: string }
        # The attempt's version after this action. Without it a client
        # that must send `version` has no way to learn the current value,
        # because there is no GET /attempts/{id}. See ADR-009.
        attemptVersion: { type: integer, minimum: 1 }
        status: { enum: [ok, not_found, unavailable, blocked] }
        items:
          type: array
          items:
            type: object
            required: [evidenceId, type, title, source, retrievedAt, verificationStatus]
            properties:
              evidenceId: { type: string }
              type: { type: string }
              title: { type: string }
              sourceUrl: { type: [string, 'null'], format: uri }
              source:
                type: object
                additionalProperties: false
                required: [sourceType, publisher, retrievedAt, license, limitations]
                properties:
                  sourceType: { enum: [official, news, academic_registry, fact_check, platform_post, metadata, team_fixture] }
                  publisher: { type: string, minLength: 1, maxLength: 200 }
                  author: { type: [string, 'null'], maxLength: 200 }
                  canonicalUrl: { type: [string, 'null'], format: uri }
                  canonicalId: { type: [string, 'null'], maxLength: 200 }
                  publishedAt: { type: [string, 'null'], format: date-time }
                  retrievedAt: { type: string, format: date-time }
                  snapshotHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
                  license:
                    type: object
                    additionalProperties: false
                    required: [identifier, attribution, useBasis]
                    properties:
                      identifier: { type: string, minLength: 1, maxLength: 80 }
                      attribution: { type: string, minLength: 1, maxLength: 1000 }
                      useBasis: { enum: [licensed, public_domain, fair_use_reviewed, team_created, metadata_only] }
                  limitations: { type: array, minItems: 1, items: { type: string } }
              retrievedAt: { type: string, format: date-time }
              verificationStatus: { enum: [verified_metadata, curated, unverified, conflicting] }
        limitations: { type: array, minItems: 1, items: { type: string } }
    Hint:
      type: object
      additionalProperties: false
      required: [text, level, evidenceRefs, uncertainty, safetyFlags, fallback]
      properties:
        text: { type: string, minLength: 1, maxLength: 600 }
        level: { type: integer, minimum: 1, maximum: 4 }
        suggestedActionId: { type: [string, 'null'], maxLength: 120 }
        evidenceRefs: { type: array, uniqueItems: true, items: { type: string, pattern: '^E-[A-Za-z0-9._-]+$' } }
        uncertainty: { enum: [low, medium, high] }
        safetyFlags:
          type: array
          uniqueItems: true
          items:
            enum:
              - needs_more_evidence
              - possible_leakage
              - unsupported_citation
              - prompt_injection_detected
              - harm_sensitive
              - provider_degraded
        fallback: { type: boolean }
    AxisAssessment:
      type: object
      additionalProperties: false
      required: [label, confidence]
      properties:
        label: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    ConclusionInput:
      type: object
      additionalProperties: false
      required: [authenticity, claimVeracity, contextIntegrity, postConfidence, shareDecision, version]
      properties:
        authenticity: { $ref: '#/components/schemas/AxisAssessment' }
        claimVeracity: { $ref: '#/components/schemas/AxisAssessment' }
        contextIntegrity: { $ref: '#/components/schemas/AxisAssessment' }
        postConfidence: { type: integer, minimum: 0, maximum: 100 }
        shareDecision: { enum: [do_not_share, share_with_context, continue_investigating] }
        version: { type: integer, minimum: 1 }
    Progress:
      type: object
      required: [totalXp, skills]
      properties:
        totalXp: { type: integer, minimum: 0 }
        skills:
          type: array
          items:
            type: object
            required: [skill, mastery]
            properties:
              skill: { type: string }
              mastery: { type: number, minimum: 0, maximum: 1 }
              dueAt: { type: string, format: date-time }
    Receipt:
      type: object
      required: [id, attemptId, missionVersion, assessments, evidenceRefs, createdAt, hash, disclaimer]
      properties:
        id: { type: string }
        attemptId: { type: string }
        missionVersion: { type: string }
        assessments:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/AxisAssessment' }
        evidenceRefs: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        hash: { type: string }
        disclaimer: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
