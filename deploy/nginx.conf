# Serves the built learner app.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page app: any unknown path is a route inside the app, not
    # a missing file. Without this a refresh on any screen but the first
    # returns 404 from nginx and the product looks broken.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a deployment lands and returning
    # visitors keep the old one until their cache expires — including
    # its references to asset names that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The app loads only its own assets, so the policy can be tight. It
    # needs wasm-unsafe-eval for the CanvasKit renderer and blob: for the
    # workers Flutter spawns; connect-src stays open because the API host
    # is chosen at build time and is not known here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
