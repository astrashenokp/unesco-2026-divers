services:
  postgres:
    # Local-only fixture. Production uses managed Cloud SQL, not this image.
    image: postgres:16.4
    environment:
      POSTGRES_DB: evidence_gym
      POSTGRES_USER: evidence_gym
      POSTGRES_PASSWORD: evidence_gym
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_gym -d evidence_gym"]
      interval: 5s
      timeout: 5s
      retries: 10
