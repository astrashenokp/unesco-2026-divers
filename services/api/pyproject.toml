[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evidence-gym-api"
version = "0.1.0"
description = "Evidence Gym FastAPI modular monolith"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "gameplay>=0.1,<0.2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "starlette>=1.3.1,<1.4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=9.0.3,<10",
  "pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_gym_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
